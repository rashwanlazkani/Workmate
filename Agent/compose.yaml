name: workmate
services:
  reminders:
    build: .
    container_name: workmate-reminders
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 128m
    cpus: 0.25
    volumes:
      - ./data:/data
      - ./connection.json:/run/secrets/connection.json:ro
      - ./credentials:/run/secrets/mqtt:ro
    tmpfs:
      - /tmp:size=8m,mode=1777
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"
